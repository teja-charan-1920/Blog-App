<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New post</title>
    <style>
        body {
            margin: 0;
            padding: 60px;
            height: 100vh;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        div {
            text-align: center;
            margin-top: 50px;
        }

        input[type="text"],
        textarea {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            width: 100%;
        }

        textarea {
            height: 400px;
            width: 100%;
        }

        button[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>New Post</h1>
    <form th:action="@{/savepost}" method="post" th:object="${posts}">
        <input type="text" th:field="*{title}" placeholder="Title" required/><br>
        <input type="text" th:value="${tags}" placeholder="Tags" name="tags"/><br>
        <textarea th:field="*{content}" placeholder="Content" required></textarea>
        <input type="hidden" th:field="*{postId}" th:value="${posts.postId}">
        <div th:if="${isRequestEdit}">
            <input type="hidden" name="isEditRequest" th:value="${isRequestEdit}">
            <input type="hidden" th:field="*{publishedAt}" th:value="${PublishedAt}">
            <input type="hidden" th:field="*{createdAt}" th:value="${CreatedAt}">
        </div>
        <button type="submit">Publish</button><br>
    </form>
</div>
</body>
</html>
