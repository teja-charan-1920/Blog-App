<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
             /* Styles for the login form container */
            .register-container {
              width: 350px;
              margin: 0 auto;
              margin-top:100px;
              padding: 20px;
              background-color: #f2f2f2;
              border: 1px solid #ccc;
              border-radius: 5px;
            }

            /* Styles for the form inputs */
            .register-container input[type="text"],
            .register-container input[type="password"] {
              width: 95%;
              padding: 10px;
              margin-bottom: 10px;
              border: 1px solid #ccc;
              border-radius: 3px;
            }

            /* Styles for the form submit button */
            .register-container input[type="submit"] {
              width: 110%;
              padding: 20px;
              background-color: #4CAF50;
              color: white;
              border: none;
              border-radius: 3px;
              cursor: pointer;
            }

            .register-container input[type="submit"]:hover {
              background-color: #45a049;
            }

            /* Styles for the form validation/error message */
            .register-container .warning {
              color: #ff0000;
              font-size: 14px;
              margin-bottom: 10px;
            }

            .register-container a {
              color: #0000ff;
              text-decoration: none;
            }

            .register-container a:hover {
              text-decoration: underline;
            }

    </style>
</head>
<body>
<div align="center" class="register-container">
    <h1>Create Account</h1>
    <div th:if="${isError}" class="warning">
        <p>Your password doesn't match the Confirm-password please try again</p>
    </div>
    <form action="#" th:action="@{/addUser}" method="post" th:object="${registerUser}">
        <input type="text" th:field="*{name}" placeholder="Name"/><br>

        <input type="text" th:field="*{email}" placeholder="Email"/><br>

        <input type="password" th:field="*{passWord}" placeholder="Password"/><br>

        <input type="password" placeholder="Confirm Password" name="password"/><br>

        <button type="submit">Submit</button><br>
        <p>Have account? <a th:href="@{/login}">Login</a></p>
    </form>
</div>
</body>
</html>
